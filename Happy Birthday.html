<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Makes the website responsive on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday! 🎉</title>

    <style>

        /* =========================
           GENERAL PAGE SETTINGS
           ========================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    #ff9acb 0%,
                    transparent 30%
                ),

                radial-gradient(
                    circle at 80% 80%,
                    #5ee7ff 0%,
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #7c3aed,
                    #ec4899 55%,
                    #f97316
                );
        }


        /* =========================
           BACKGROUND GLOW
           ========================= */

        .background-glow {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

            background:
                rgba(255, 255, 255, 0.05);
        }


        /* =========================
           MAIN CARD
           ========================= */

        .birthday-card {
            position: relative;

            z-index: 5;

            width: min(760px, 94vw);

            padding:
                clamp(35px, 7vw, 70px)
                clamp(20px, 6vw, 60px);

            text-align: center;

            border:
                1px solid
                rgba(255, 255, 255, 0.35);

            border-radius: 32px;

            background:
                rgba(255, 255, 255, 0.15);

            backdrop-filter: blur(18px);

            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 25px 80px
                rgba(20, 10, 60, 0.35);
        }


        /* =========================
           BIRTHDAY CAKE
           ========================= */

        .cake {
            font-size:
                clamp(60px, 11vw, 105px);

            animation:
                cakeBounce 2s
                ease-in-out
                infinite;
        }


        /* =========================
           MAIN TITLE
           ========================= */

        h1 {
            margin:
                15px 0;

            font-size:
                clamp(42px, 8vw, 78px);

            line-height: 1;

            text-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.15);
        }


        /* =========================
           BIRTHDAY MESSAGE
           ========================= */

        .birthday-message {
            max-width: 620px;

            margin:
                20px auto 32px;

            font-size:
                clamp(18px, 3vw, 25px);

            line-height: 1.5;
        }


        /* =========================
           CELEBRATE BUTTON
           ========================= */

        #celebrateButton {
            border: none;

            border-radius: 999px;

            padding:
                17px 34px;

            font-size:
                clamp(17px, 2.5vw, 20px);

            font-weight: bold;

            color: #7c2d64;

            background: white;

            cursor: pointer;

            box-shadow:
                0 12px 30px
                rgba(0, 0, 0, 0.25);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        #celebrateButton:hover {
            transform:
                translateY(-4px)
                scale(1.04);

            box-shadow:
                0 17px 35px
                rgba(0, 0, 0, 0.30);
        }


        #celebrateButton:active {
            transform:
                scale(0.96);
        }


        /* =========================
           SURPRISE MESSAGE
           ========================= */

        #surpriseMessage {
            display: none;

            margin-top: 28px;

            font-size:
                clamp(18px, 3vw, 24px);

            font-weight: bold;

            line-height: 1.6;

            animation:
                revealMessage 0.6s ease;
        }


        /* =========================
           FLOATING BALLOONS
           ========================= */

        .balloon {
            position: fixed;

            z-index: 1;

            bottom: -140px;

            width: 55px;
            height: 70px;

            border-radius:
                50% 50% 45% 45%;

            opacity: 0.85;

            animation:
                balloonFloat
                linear
                infinite;
        }


        /* Balloon string */

        .balloon::after {
            content: "";

            position: absolute;

            width: 1px;
            height: 100px;

            left: 50%;
            top: 67px;

            background:
                rgba(255, 255, 255, 0.75);
        }


        .balloon-1 {
            left: 7%;

            background: #ff4d6d;

            animation-duration: 11s;
        }


        .balloon-2 {
            left: 25%;

            background: #ffd166;

            animation-duration: 14s;

            animation-delay: 2s;
        }


        .balloon-3 {
            left: 72%;

            background: #06d6a0;

            animation-duration: 12s;

            animation-delay: 1s;
        }


        .balloon-4 {
            left: 90%;

            background: #4cc9f0;

            animation-duration: 15s;

            animation-delay: 4s;
        }


        /* =========================
           CONFETTI
           ========================= */

        .confetti {
            position: fixed;

            top: -30px;

            z-index: 100;

            width: 9px;
            height: 18px;

            pointer-events: none;

            animation:
                confettiFall
                linear
                forwards;
        }


        /* =========================
           ANIMATIONS
           ========================= */

        @keyframes cakeBounce {

            0%,
            100% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-12px)
                    rotate(2deg);
            }
        }


        @keyframes balloonFloat {

            from {
                transform:
                    translateY(0)
                    rotate(0deg);
            }

            to {
                transform:
                    translateY(-125vh)
                    rotate(25deg);
            }
        }


        @keyframes confettiFall {

            to {
                transform:
                    translateY(110vh)
                    rotate(720deg);
            }
        }


        @keyframes revealMessage {

            from {
                opacity: 0;

                transform:
                    scale(0.6);
            }

            to {
                opacity: 1;

                transform:
                    scale(1);
            }
        }


        /* =========================
           PHONE RESPONSIVENESS
           ========================= */

        @media (max-width: 600px) {

            body {
                padding: 14px;
            }

            .birthday-card {
                width: 100%;

                border-radius: 26px;

                padding:
                    35px 18px;
            }

            .birthday-message {
                margin-bottom: 26px;
            }

            #celebrateButton {
                width: 90%;

                max-width: 330px;
            }

            .balloon {
                transform:
                    scale(0.75);
            }
        }

    </style>
</head>


<body>

    <!-- =========================
         BACKGROUND
         ========================= -->

    <div class="background-glow"></div>


    <!-- =========================
         FLOATING BALLOONS
         ========================= -->

    <div class="balloon balloon-1"></div>

    <div class="balloon balloon-2"></div>

    <div class="balloon balloon-3"></div>

    <div class="balloon balloon-4"></div>


    <!-- =========================
         BIRTHDAY CARD
         ========================= -->

    <main class="birthday-card">

        <!-- Cake -->
        <div class="cake">
            🎂
        </div>


        <!-- Title -->
        <h1>
            Happy Birthday! 🎉
        </h1>


        <!-- Message -->
        <p class="birthday-message">

            Wishing you a wonderful birthday
            filled with happiness, laughter,
            love and unforgettable memories! ❤️

        </p>


        <!-- Celebrate Button -->
        <button id="celebrateButton">

            Click To celebrate 🎊

        </button>


        <!-- Hidden message -->
        <div id="surpriseMessage">

            🥳🎈 LET THE CELEBRATION BEGIN! 🎈🥳

            <br>

            Have the most amazing birthday ever! 💖✨

        </div>

    </main>


    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script>

        /* Get the button */
        const celebrateButton =
            document.getElementById(
                "celebrateButton"
            );


        /* Get the hidden message */
        const surpriseMessage =
            document.getElementById(
                "surpriseMessage"
            );


        /* Confetti colors */
        const confettiColors = [

            "#ff4d6d",
            "#ffd166",
            "#06d6a0",
            "#4cc9f0",
            "#ffffff",
            "#c77dff",
            "#f97316"

        ];


        /* =========================
           CREATE CONFETTI
           ========================= */

        function createConfetti() {

            /* Number of confetti pieces */
            const numberOfPieces = 200;


            /* Create each piece */
            for (
                let i = 0;
                i < numberOfPieces;
                i++
            ) {

                /* Create a new div */
                const confetti =
                    document.createElement(
                        "div"
                    );


                /* Give it the confetti class */
                confetti.className =
                    "confetti";


                /* Random horizontal position */

                confetti.style.left =
                    Math.random() * 100 +
                    "vw";


                /* Random color */

                confetti.style.background =
                    confettiColors[
                        Math.floor(
                            Math.random() *
                            confettiColors.length
                        )
                    ];


                /* Random width */

                confetti.style.width =
                    5 +
                    Math.random() * 8 +
                    "px";


                /* Random height */

                confetti.style.height =
                    8 +
                    Math.random() * 14 +
                    "px";


                /* Random rotation */

                confetti.style.transform =
                    "rotate(" +
                    Math.random() * 360 +
                    "deg)";


                /* Random falling speed */

                confetti.style.animationDuration =
                    2 +
                    Math.random() * 3 +
                    "s";


                /* Random delay */

                confetti.style.animationDelay =
                    Math.random() * 0.7 +
                    "s";


                /* Add confetti to page */

                document.body.appendChild(
                    confetti
                );


                /* Remove confetti after animation */

                setTimeout(
                    () => {
                        confetti.remove();
                    },
                    6000
                );
            }
        }


        /* =========================
           CELEBRATION FUNCTION
           ========================= */

        function celebrate() {

            /* Show surprise message */

            surpriseMessage.style.display =
                "block";


            /* Change button text */

            celebrateButton.textContent =
                "🎉 Celebrating!";


            /* Start confetti */

            createConfetti();


            /* Allow another celebration */

            setTimeout(
                () => {

                    celebrateButton.textContent =
                        "🎊 Celebrate Again!";

                },
                1800
            );
        }


        /* =========================
           BUTTON CLICK
           ========================= */

        celebrateButton.addEventListener(
            "click",
            celebrate
        );

    </script>

</body>

</html>
